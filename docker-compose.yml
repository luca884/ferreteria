# Base de datos local para desarrollo. El backend corre con ./mvnw spring-boot:run (perfil dev).
services:
  mysql:
    image: mysql:8.4
    container_name: ferreteria-mysql
    environment:
      MYSQL_DATABASE: ferreteria
      MYSQL_USER: ferreteria
      MYSQL_PASSWORD: ferreteria
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      # Solo desde esta máquina: con 0.0.0.0, cualquiera en la misma red entra con root/root (hallazgo 9).
      - "127.0.0.1:3307:3306"
    volumes:
      - ferreteria-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

volumes:
  ferreteria-mysql:
