# Perfil de desarrollo local: carga datos de demo (2 ferreterias, usuarios con contrasena demo1234).
spring:
  flyway:
    # db/dev-only: solo dev (el perfil test carga db/dev-data, no esta); hoy, las demo facturando con el simulador de ARCA.
    locations: classpath:db/migration,classpath:db/dev-data,classpath:db/dev-only
    # Los datos demo (V1000+) quedan aplicados antes que las migraciones nuevas del esquema (V4, V5...).
    # Sin esto, Flyway rechaza en una base dev existente toda migración con número menor al último aplicado.
    out-of-order: true
app:
  jwt:
    # Solo para desarrollo local: en prod JWT_SECRET es obligatorio y application.yml no trae default.
    secret: ${JWT_SECRET:dev-secret-ferreteria-cambiar-en-produccion-0123456789}
  facturacion:
    # Solo para desarrollo local ("solo-dev-clave-maestra-arca-0001" en Base64): en prod ARCA_CLAVE_MAESTRA es obligatoria.
    clave-maestra: ${ARCA_CLAVE_MAESTRA:c29sby1kZXYtY2xhdmUtbWFlc3RyYS1hcmNhLTAwMDE=}
  auth:
    totp:
      # Solo para desarrollo local ("solo-dev-clave-maestra-totp-0001" en Base64): en prod TOTP_CLAVE_MAESTRA es obligatoria.
      clave-maestra: ${TOTP_CLAVE_MAESTRA:c29sby1kZXYtY2xhdmUtbWFlc3RyYS10b3RwLTAwMDE=}
