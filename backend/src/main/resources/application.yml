spring:
  application:
    name: ferreteria-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ferreteria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:ferreteria}
    password: ${DB_PASSWORD:ferreteria}
  jackson:
    deserialization:
      # Sin esto Jackson acepta el ordinal de un enum: "alicuotaIva": 5 se guardaba como IVA_27.
      fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Las actualizaciones de la importacion de listas se agrupan; los INSERT con IDENTITY no.
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      # Listas de proveedores: 10 MB de archivo y lugar para la parte "datos" (JSON).
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
  compression:
    # La muestra de una hoja de 20.000 filas pesa varios MB de JSON; comprimido baja ~10 veces.
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # En produccion JWT_SECRET es obligatorio (minimo 32 bytes). Este default es solo para dev.
    secret: ${JWT_SECRET:dev-secret-ferreteria-cambiar-en-produccion-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
