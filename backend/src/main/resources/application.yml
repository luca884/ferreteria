spring:
  application:
    name: ferreteria-api
  profiles:
    # Sin la variable arranca en prod (sin datos demo): el desarrollo local usa dev explícito (pom.xml, spring-boot:run).
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ferreteria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:ferreteria}
    password: ${DB_PASSWORD:ferreteria}
  jackson:
    deserialization:
      # Sin esto Jackson acepta el ordinal de un enum: "alicuotaIva": 5 se guardaba como IVA_27.
      fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # Las actualizaciones de la importacion de listas se agrupan; los INSERT con IDENTITY no.
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      # Listas de proveedores: 25 MB de archivo y lugar para la parte "datos" (JSON), que con 20.000 filas elegidas
      # pesa unos 450 KB.
      max-file-size: 25MB
      max-request-size: 27MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    # Con el apagado ordenado, cuánto espera el servidor web los pedidos en curso (el drenaje de Railway tiene que cubrirlo).
    timeout-per-shutdown-phase: ${APAGADO_ESPERA_POR_FASE:20s}
  task:
    scheduling:
      shutdown:
        # Al apagar, la tarea programada que esté corriendo termina en vez de cortarse a la mitad.
        await-termination: true
        # Lo más que se la espera; va después de la espera del ejecutor fiscal, y el drenaje de Railway cubre las dos.
        await-termination-period: ${APAGADO_ESPERA_TAREAS_PROGRAMADAS:20s}

server:
  port: ${PORT:8080}
  # Con SIGTERM (Railway, en cada deploy) deja de aceptar pedidos y termina los que están en curso antes de apagarse.
  shutdown: graceful
  error:
    include-message: never
  compression:
    # La muestra de una hoja de 20.000 filas pesa varios MB de JSON; comprimido baja ~10 veces.
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # JWT_SECRET es obligatorio (minimo 32 bytes): sin la variable la app no arranca. El default de dev esta en application-dev.yml.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  cotizacion:
    # Fuente principal y respaldo de la cotizacion. Los tests apuntan las dos a 127.0.0.1:9 (application-test.yml).
    dolarapi:
      url: ${DOLARAPI_URL:https://dolarapi.com}
    bluelytics:
      url: ${BLUELYTICS_URL:https://api.bluelytics.com.ar}
  facturacion:
    # Clave maestra del cifrado AES-GCM de las claves privadas de ARCA (32 bytes en Base64, «openssl rand -base64 32»).
    # Obligatoria y sin default: sin la variable, o con otro largo, la app no arranca. El default de dev esta en
    # application-dev.yml. Para rotarla, la vieja pasa a ARCA_CLAVE_MAESTRA_ANTERIOR (opcional) y se lee igual.
    clave-maestra: ${ARCA_CLAVE_MAESTRA}
    clave-maestra-anterior: ${ARCA_CLAVE_MAESTRA_ANTERIOR:}
    simulador:
      # Demora de cada llamada al simulador de WSFEv1, como la red hasta ARCA. 0 en tests y en prod; en dev, el documento de
      # abajo la sube a un valor chico para ver la espera en la pantalla.
      latencia: ${SIMULADOR_WSFE_LATENCIA:0ms}
      # Montos que el manual 4.8 nombra y no trae (los fija ARCA aparte): valores de trabajo del simulador, sin efecto fiscal.
      # tope-rg4444: desde ese ImpTotal la Factura B exige identificar al receptor (10015). minimo-fce: desde ese ImpTotal, a
      # un receptor con CUIT, el simulador observa que corresponderia una factura de credito electronica (10188).
      tope-rg4444: ${SIMULADOR_WSFE_TOPE_RG4444:10000000.00}
      minimo-fce: ${SIMULADOR_WSFE_MINIMO_FCE:3958316.00}
    motor:
      # Lo más que puede tardar una llamada a WSFEv1 (conexión más lectura). El cliente real (rama 6) arma sus timeouts con
      # este valor, y la latencia del simulador tiene que quedar por debajo.
      presupuesto-llamada: ${FACTURACION_PRESUPUESTO_LLAMADA:60s}
      # Cuánto dura la toma de una serie; se estira antes de cada llamada. Tiene que superar el presupuesto de la llamada
      # (si no, la app no arranca): si venciera con una llamada en vuelo, otra instancia vería N-1, reenviaría y ARCA
      # contestaría 10016.
      lease: ${FACTURACION_LEASE_SERIE:180s}
    arca:
      # Cliente real de ARCA (rama 6, C6). Las URL salen solo de acá, sin variable ni endpoint que las cambie: un deploy no
      # puede mandar los pedidos a otro lado. Son las del soap:address de cada WSDL.
      wsaa:
        homologacion: https://wsaahomo.afip.gov.ar/ws/services/LoginCms
        produccion: https://wsaa.afip.gov.ar/ws/services/LoginCms
      wsfe:
        homologacion: https://wswhomo.afip.gov.ar/wsfev1/service.asmx
        produccion: https://servicios1.afip.gov.ar/wsfev1/service.asmx
      # Cuánto se espera para conectar (con el handshake TLS) y para la respuesta de cada llamada. Al arrancar se valida que
      # 2 × (timeout-conexion + timeout-lectura) + espera-ticket entre en motor.presupuesto-llamada (WSAA y WSFE en la misma
      # atención); si no, la app no arranca.
      timeout-conexion: ${ARCA_TIMEOUT_CONEXION:5s}
      timeout-lectura: ${ARCA_TIMEOUT_LECTURA:20s}
      # Lapso preventivo del TA (FAQ 10.6 del manual de WSAA): dentro de ese tiempo desde que se sacó, ARCA puede rechazar
      # otro loginCms aunque el TA siga vigente. ARCA lo puede cambiar sin aviso.
      lapso-ta:
        homologacion: ${ARCA_LAPSO_TA_HOMOLOGACION:10m}
        produccion: ${ARCA_LAPSO_TA_PRODUCCION:2m}
        simulador: ${ARCA_LAPSO_TA_SIMULADOR:10m}
      # El TA se renueva cuando le faltan menos que esto para vencer (y ya pasó el lapso).
      margen-renovacion: ${ARCA_MARGEN_RENOVACION:30m}
      # Cuánto no se llama a WSAA después de wsaa.* o wsn.unavailable (60 s o más), de coe.alreadyAuthenticated y de un error
      # del sistema (xml.*, cms.bad*, códigos desconocidos).
      espera-wsaa: ${ARCA_ESPERA_WSAA:60s}
      espera-ta-vigente: ${ARCA_ESPERA_TA_VIGENTE:10m}
      espera-error-sistema: ${ARCA_ESPERA_ERROR_SISTEMA:30m}
      # Cuánto espera un pedido mientras otro saca el TA, y cuánto dura esa toma (tiene que superar una llamada: si no, la
      # app no arranca).
      espera-ticket: ${ARCA_ESPERA_TICKET:10s}
      lease-ticket: ${ARCA_LEASE_TICKET:90s}
    # Tope de ARCA (RG 5866) para la venta sin cliente identificado: desde ese total, inclusive, no se factura anónima.
    tope-identificacion: ${FACTURACION_TOPE_IDENTIFICACION:10000000.00}
    venta:
      # Cuánto espera la venta su CAE antes de responder con el estado que haya (de 5 a 8 s en producción).
      espera: ${FACTURACION_VENTA_ESPERA:6s}
      # Pausa entre atenciones mientras otra instancia tiene tomada la serie.
      pausa-serie-ocupada: ${FACTURACION_VENTA_PAUSA_SERIE_OCUPADA:200ms}
      # Hilos del ejecutor que pide los CAE de las ventas.
      hilos: ${FACTURACION_VENTA_HILOS:8}
      # Pedidos que esperan un hilo libre; con la cola llena, la venta responde sin esperar su CAE.
      cola: ${FACTURACION_VENTA_COLA:100}
      # Al apagar, cuánto se espera a que terminen los pedidos de CAE en curso (el drenaje de Railway tiene que cubrirlo).
      espera-al-apagar: ${FACTURACION_VENTA_ESPERA_AL_APAGAR:20s}

---
# Desarrollo local: el simulador de WSFEv1 tarda un poco, como ARCA.
spring:
  config:
    activate:
      on-profile: dev
app:
  facturacion:
    simulador:
      latencia: ${SIMULADOR_WSFE_LATENCIA:300ms}
