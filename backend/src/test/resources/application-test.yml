# Tests de integracion: el datasource lo pone Testcontainers (@ServiceConnection).
spring:
  flyway:
    # db/test-data: solo tests (V1100 deja las ferreterias demo con el multiplo de $10 de los tests de precios).
    locations: classpath:db/migration,classpath:db/dev-data,classpath:db/test-data
  jpa:
    properties:
      hibernate:
        # Captura el SQL real solo dentro de SqlCapturado.durante(...), para el EXPLAIN del filtro (lote 5b, C-226).
        session_factory:
          statement_inspector: com.ferreteria.support.SqlCapturado
app:
  jwt:
    secret: test-secret-ferreteria-solo-para-tests-0123456789
  # Ningun test toca la red ni corre tareas solas: sin scheduler y con las fuentes apuntando a un puerto donde no escucha nadie.
  programacion:
    habilitada: false
  cotizacion:
    dolarapi:
      url: http://127.0.0.1:9
    bluelytics:
      url: http://127.0.0.1:9
