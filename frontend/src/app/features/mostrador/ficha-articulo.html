<article class="ficha">
  <h2 class="descripcion">{{ articulo().descripcion }}</h2>
  <p class="precio">{{ articulo().precioFinal | monto }}</p>
  <dl class="datos">
    <div>
      <dt>Stock</dt>
      <dd class="stock" [attr.data-stock]="estadoStock(articulo())">
        {{ cantidadConUnidad(articulo().stockActual, articulo().unidad) }}
      </dd>
    </div>
    <div>
      <dt>Ubicación</dt>
      <dd class="ubicacion">{{ articulo().ubicacion ?? '—' }}</dd>
    </div>
    <div>
      <dt>Código interno</dt>
      <dd class="codigo-interno">{{ articulo().codigoInterno }}</dd>
    </div>
    <div>
      <dt>Código de barras</dt>
      <dd class="codigo-barras">{{ articulo().codigoBarras ?? '—' }}</dd>
    </div>
  </dl>
</article>
