<input
  #campo
  type="text"
  class="caja"
  placeholder="Escaneá un código o escribí una descripción…"
  autocomplete="off"
  spellcheck="false"
  role="combobox"
  aria-autocomplete="list"
  aria-label="Buscar artículo"
  [attr.aria-expanded]="controla() !== null"
  [attr.aria-controls]="controla()"
  [attr.aria-activedescendant]="opcionActiva()"
  [value]="texto()"
  (input)="texto.set($any($event.target).value)"
  (keydown)="alTeclear($event)"
  (blur)="alPerderFoco($event)"
/>
