<main class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
    <div class="marca">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5 20.2 7.25v9.5L12 21.5l-8.2-4.75v-9.5z" />
        <circle cx="12" cy="12" r="3.6" />
      </svg>
      <h1>Ferretería</h1>
    </div>
    <p class="sub">Ingresá con tu usuario</p>
    <!-- Si el reintento falla, manda el error del ingreso: los dos avisos juntos se contradecían (guía al día). -->
    @if (sesionCerrada && !error()) {
      <p class="alerta advertencia sesion-cerrada" role="status">Tu sesión se cerró. Ingresá de nuevo.</p>
    }

    <div class="campo">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        spellcheck="false"
        autofocus
        [attr.aria-invalid]="invalido('email') ? 'true' : null"
        [attr.aria-describedby]="descripcion('email')"
      />
      @if (invalido('email')) {
        <span id="email-error" class="campo-error">Ingresá un email válido.</span>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="invalido('password') ? 'true' : null"
        [attr.aria-describedby]="descripcion('password')"
      />
      @if (invalido('password')) {
        <span id="password-error" class="campo-error">Ingresá tu contraseña.</span>
      }
    </div>

    @if (error(); as mensaje) {
      <p id="login-error" class="error" role="alert">{{ mensaje }}</p>
    }

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</main>
