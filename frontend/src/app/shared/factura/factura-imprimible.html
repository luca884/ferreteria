<!-- El mousedown sobre el fondo no mueve el foco al body: si no, Esc y Enter (que escucha el diálogo) dejarían de andar. -->
<div class="dialogo-fondo" (mousedown)="retenerFoco($event)">
  <div
    class="dialogo factura"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="factura-titulo"
    appTrampaFoco
    (keydown)="alTeclear($event)"
  >
    <div class="cabecera">
      <h2 id="factura-titulo">{{ titulo() }}</h2>
      @if (vueltoCentavos(); as vuelto) {
        <p class="vuelto">Vuelto <strong>{{ vuelto / 100 | monto }}</strong></p>
      }
    </div>
    @if (aviso(); as texto) {
      <p class="aviso" role="status">{{ texto }}</p>
    }

    <article class="factura-imprimible">
      <app-factura-hoja [documento]="documento()" [venta]="venta()" />
    </article>

    <div class="dialogo-acciones">
      <button type="button" class="cerrar" data-tecla="Esc" aria-keyshortcuts="Escape" (click)="cerrar.emit()">
        Cerrar
      </button>
      <button
        #botonImprimir
        type="button"
        class="imprimir primario"
        data-tecla="Enter"
        aria-keyshortcuts="Enter"
        (click)="imprimir()"
      >
        Imprimir
      </button>
    </div>
  </div>
</div>
