<header class="barra">
  <div class="marca">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.5 20.2 7.25v9.5L12 21.5l-8.2-4.75v-9.5z" />
      <circle cx="12" cy="12" r="3.6" />
    </svg>
    <strong class="ferreteria">{{ auth.sesion()?.ferreteriaNombre ?? 'Panel de administración' }}</strong>
  </div>
  <nav aria-label="Secciones">
    <a routerLink="/mostrador" routerLinkActive="activo">Mostrador</a>
    <a routerLink="/rubros" routerLinkActive="activo">Rubros</a>
    <a routerLink="/articulos" routerLinkActive="activo">Artículos</a>
    <a routerLink="/proveedores" routerLinkActive="activo">Proveedores</a>
    @if (auth.esDueno()) {
      <a routerLink="/importaciones" routerLinkActive="activo">Importar lista</a>
      <a routerLink="/actualizacion-masiva" routerLinkActive="activo">Actualizar precios</a>
    }
  </nav>
  <div class="usuario">
    @if (auth.sesion(); as sesion) {
      <span class="usuario-datos">
        <span class="usuario-nombre">{{ sesion.nombre }}</span>
        <span class="usuario-rol">{{ rolLabels[sesion.rol] }}</span>
      </span>
    }
    <button type="button" class="salir" (click)="salir()">Salir</button>
  </div>
</header>
<main class="contenido">
  <router-outlet />
</main>
